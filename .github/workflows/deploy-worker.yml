name: Deploy API worker

# Deploys worker/ to Cloudflare when it changes on main (or when started by hand).
# Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN   Cloudflare API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   GH_API_TOKEN           GitHub fine-grained token (public repositories, read-only, no extra permissions)
on:
  push:
    branches: [main]
    paths: ['worker/**', 'js/stats.js', 'js/sources.js', 'js/palettes.js']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
        working-directory: worker
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.151.2'
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set — skipping the worker deploy."
